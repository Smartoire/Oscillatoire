plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.smartoire.brainwave'
    compileSdk 36

    defaultConfig {
        applicationId 'com.smartoire.oscillatoire'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    // Release signing reads the keystore from the user's ~/.gradle/gradle.properties. Nothing secret lives in the repo.
    signingConfigs {
        release {
            if (project.hasProperty('BRAINWAVE_STORE_FILE')) {
                storeFile file(BRAINWAVE_STORE_FILE)
                storePassword BRAINWAVE_STORE_PASSWORD
                keyAlias BRAINWAVE_KEY_ALIAS
                keyPassword BRAINWAVE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('BRAINWAVE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures { compose true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
