# Xcode project spec. Regenerate the project after editing: `xcodegen`
# App/ is a synchronized folder, so adding Swift files there needs no regeneration.
name: Brainwave
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  BrainwaveKit:
    path: Packages/BrainwaveKit
targets:
  Brainwave:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        type: syncedFolder
    dependencies:
      - package: BrainwaveKit
      - framework: Vendor/Muse.xcframework   # built by tools/setup_muse_sdk.sh (static, not embedded)
        embed: false
      - sdk: CoreBluetooth.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartoire.oscillatoire
        DEVELOPMENT_TEAM: XZ8V34LM8C
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Config/Brainwave-Bridging-Header.h
        OTHER_LDFLAGS: -lc++   # libmuse is a static C++ library
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/Brainwave.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Config/Brainwave-iOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Brainwave
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Brainwave saves your calm sessions to Apple Health as Mindful Minutes, if you allow it.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Brainwave does not read your Health data. It only saves your calm sessions to Apple Health as Mindful Minutes, if you allow it.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Brainwave connects to your Muse headband over Bluetooth to show your brain activity.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
